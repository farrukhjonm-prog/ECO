        function round2(v) {
            const n = Number(v) || 0;
            return Math.round((n + Number.EPSILON) * 100) / 100;
        }

        function fmtMoney(v) {
            return round2(v).toLocaleString('ru-RU', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }) + ' ' + CURRENCY_SHORT;
        }

        function fmtQty(qty, unit) {
            const n = Number(qty) || 0;
            if (unit === 'шт') return `${Math.round(n)} шт`;
            return `${Number(n.toFixed(2))} кг`;
        }

        function fmtDate(iso) {
            if (!iso) return '—';
            return new Date(iso).toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function fmtDateTime(iso) {
            if (!iso) return '—';
            return new Date(iso).toLocaleString('ru-RU', {
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        }

        function daysUntil(isoDate) {
            const now = new Date();
            now.setHours(0, 0, 0, 0);
            const target = new Date(isoDate);
            target.setHours(0, 0, 0, 0);
            return Math.ceil((target - now) / (1000 * 3600 * 24));
        }

        function addDaysISO(days) {
            const d = new Date();
            d.setDate(d.getDate() + days);
            return d.toISOString().split('T')[0];
        }

        function esc(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function generateIdempotencyKey() {
            return 'IDEMP-' + Date.now() + '-' + Math.random().toString(36).substring(2, 8).toUpperCase();

        /* =========================================================================

            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return createDefaultState();
                const parsed = JSON.parse(raw);
                if (!parsed || !Array.isArray(parsed.users)) return createDefaultState();
                return parsed;

                return createDefaultState();

        function getProductStock(product) {
            return round2((product.batches || []).reduce((s, b) => s + (Number(b.qty) || 0), 0));
        }

        function findBuyerAndShop(buyerId, shopId) {
            const buyer = state.buyers.find(b => b.id === buyerId);
            const shop = buyer ? buyer.shops.find(s => s.id === shopId) : null;
            return { buyer, shop };
        }

        function findShopById(shopId) {
            for (const b of state.buyers) {
                const s = b.shops.find(x => x.id === shopId);

        /* =========================================================================
           4. ФИНАНСОВОЕ ЯДРО (СКИДКА, ДОЛГ, ВОЗВРАТЫ, КОМИССИЯ)
           ========================================================================= */
        function calcSaleFinancials(sale) {
            const originalGross = round2(sale.items.reduce((s, it) => s + (it.qty * it.price), 0));
            const returnedGross = round2(sale.items.reduce((s, it) => s + ((it.returnedQty || 0) * it.price), 0));
            const activeGross = round2(originalGross - returnedGross);

            const discountPercent = Number(sale.discountPercent) || 0;
            const discountAmount = round2(activeGross * discountPercent / 100);
            const finalPayable = round2(activeGross - discountAmount);

            const totalReceived = round2((Number(sale.paidInitial) || 0) + (Number(sale.debtPaid) || 0));
            const cashRefunded = round2(Number(sale.cashRefunded) || 0);
            const effectivePaid = round2(Math.max(0, totalReceived - cashRefunded));

            const debt = round2(Math.max(0, finalPayable - effectivePaid));
            const commBase = Math.min(effectivePaid, finalPayable);
            const commission = sale.status === 'confirmed'
                ? round2(commBase * (Number(sale.commissionRate) || 0) / 100)
                : 0;
            const totalReturnedNet = round2((sale.returns || []).reduce((s, r) => s + (r.netReturn || 0), 0));

            return {
                originalGross, returnedGross, activeGross,
                discountPercent, discountAmount, finalPayable,
                effectivePaid, cashRefunded, debt, commission, totalReturnedNet
            };
        }

        function getShopDebt(shopId) {
            return round2(
                state.sales
                    .filter(s => s.status === 'confirmed' && s.shopId === shopId)
                    .reduce((sum, s) => sum + calcSaleFinancials(s).debt, 0)
            );
        }

        function getPendingDiscountCount() {
            return state.sales.filter(s => s.status === 'pending_approval').length;
        }

        function computeEmployeeStats(userId) {
            const confirmed = state.sales.filter(s => s.employeeId === userId && s.status === 'confirmed');
            let gross = 0, discount = 0, payable = 0, paid = 0, debt = 0, returns = 0, comm = 0;
            for (const s of confirmed) {
                const f = calcSaleFinancials(s);
                gross = round2(gross + f.activeGross);
                discount = round2(discount + f.discountAmount);
                payable = round2(payable + f.finalPayable);
                paid = round2(paid + f.effectivePaid);
                debt = round2(debt + f.debt);
                returns = round2(returns + f.totalReturnedNet);
                comm = round2(comm + f.commission);
            }
            return { count: confirmed.length, gross, discount, payable, paid, debt, returns, comm };
        }

                <button onclick="openMobileMoreMenu()" class="flex flex-col items-center justify-center py-1 px-2 rounded-xl min-w-[60px] text-slate-500">
                    <div class="px-3 py-0.5 rounded-full">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </div>
                    <span class="text-[10px] font-semibold mt-0.5">Меню</span>
                </button>
            ` : '');

            // 6. Рендер основного контента
            const main = document.getElementById('app-main');
            if (isPendingAdmin(user)) {
                main.innerHTML = renderPendingAdminScreen(user);
                return;
            }

            switch (state.activeTab) {
                case 'sales': main.innerHTML = renderSalesTab(user); break;
                case 'warehouse': main.innerHTML = renderWarehouseTab(user); break;
                case 'shops': main.innerHTML = renderShopsAndFridgesTab(user); break;
                case 'printer': main.innerHTML = renderPrinterTab(); break;
                case 'inventory': main.innerHTML = renderInventoryTab(); break;
                case 'reports': main.innerHTML = renderReportsTab(user); break;
                case 'team': main.innerHTML = renderTeamAndSubscriptionTab(user); break;
                case 'audit': main.innerHTML = renderAuditTab(); break;
                case 'android_docs': main.innerHTML = renderAndroidDocsTab(); break;
                default: main.innerHTML = renderSalesTab(user);
            }
        }

        function openMobileMoreMenu() {
            const navItems = getNavItemsForUser(getActiveUser());
            openModal(`
                <div class="p-5">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="text-base font-extrabold text-slate-900">Все разделы</h3>
                        <button onclick="closeModal()" class="text-slate-400 text-xl">&times;</button>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        ${navItems.map(it => `
                            <button onclick="closeModal(); navigate('${it.id}')"
                                class="p-3 rounded-2xl border text-left flex items-center gap-2.5 text-xs font-bold ${
                                    state.activeTab === it.id ? 'bg-brand-700 text-white border-brand-700' : 'bg-slate-50 text-slate-800 border-slate-200'

                                <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${it.icon}"/>

                            </button>

                    </div>
                </div>

        }

        function renderPendingAdminScreen(user) {
            return `
                <div class="bg-white rounded-3xl border-2 border-amber-300 p-8 text-center max-w-lg mx-auto shadow-sm mt-6">
                    <div class="w-16 h-16 rounded-2xl bg-amber-100 text-amber-700 flex items-center justify-center mx-auto mb-4">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                        </svg>
                    </div>
                    <h2 class="text-xl font-extrabold text-slate-900">Ожидает подтверждения владельца</h2>

                    </p>
                    <div class="mt-6 p-3.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs text-slate-600">

                    </div>
                    <button onclick="openAccountSwitcher()" class="mt-5 px-5 py-2.5 rounded-2xl bg-brand-700 hover:bg-brand-800 text-white text-sm font-bold transition-colors">
                        Сменить аккаунт
                    </button>
                </div>
            `;
        }

        /* =========================================================================
           8. ВКЛАДКА 1: ОПТОВЫЕ ПРОДАЖИ, РУЧНАЯ СКИДКА, ПОДТВЕРЖДЕНИЕ И ВОЗВРАТЫ
           ========================================================================= */
        function renderSalesTab(user) {
            const pendingSales = state.sales.filter(s => s.status === 'pending_approval');
            const visibleSales = isManager(user) ? state.sales : state.sales.filter(s => s.employeeId === user.id);

            const { buyer, shop } = findBuyerAndShop(saleDraft.buyerId, saleDraft.shopId);
            const shopDebt = shop ? getShopDebt(shop.id) : 0;

            const gross = round2(saleDraft.items.reduce((s, i) => s + i.qty * i.price, 0));
            const discPct = Math.max(0, Math.min(100, Number(saleDraft.discountPercent) || 0));
            const discAmt = round2(gross * discPct / 100);
            const payable = round2(gross - discAmt);
            const paid = Math.max(0, Number(saleDraft.paidAmount) || 0);
            const debt = round2(Math.max(0, payable - paid));
            const commRate = user.commissionRate || 0;
            const projComm = round2(Math.min(paid, payable) * commRate / 100);
            const exceedsLimit = discPct > user.maxDiscount;

            // Доступные партии для выбранного товара
            const firstProd = state.warehouse[0];

            return `
                <div class="space-y-5">
                    <!-- Блок запросов скидок сверх лимита (только Владелец и подтверждённый Админ) -->
                    ${isManager(user) && pendingSales.length > 0 ? `
                        <div class="bg-amber-50 border-2 border-amber-300 rounded-3xl p-4 sm:p-5 space-y-3">
                            <div class="flex items-center justify-between">
                                <h2 class="text-sm sm:text-base font-extrabold text-amber-900 flex items-center gap-2">
                                    <span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-ping"></span>
                                    Запросы скидок сверх лимита (${pendingSales.length})
                                </h2>
                            </div>
                            <div class="space-y-2.5">
                                ${pendingSales.map(s => {
                                    const f = calcSaleFinancials(s);
                                    return `
                                        <div class="bg-white rounded-2xl p-4 border border-amber-200 flex flex-col md:flex-row md:items-center justify-between gap-3">
                                            <div class="text-xs sm:text-sm space-y-1">
                                                <div class="font-bold text-slate-900">
                                                    ${esc(s.id)} • ${esc(s.employeeName)} запросил скидку <span class="text-rose-600">${s.discountPercent}%</span>
                                                </div>
                                                <div class="text-slate-600">
                                                    ${esc(s.buyerName)} (${esc(s.shopName)}) • До скидки: <strong>${fmtMoney(f.activeGross)}</strong> → К оплате: <strong class="text-brand-700">${fmtMoney(f.finalPayable)}</strong>
                                                </div>
                                            </div>
                                            <div class="flex items-center gap-2 shrink-0">
                                                <button onclick="rejectPendingSale('${s.id}')" class="px-3.5 py-2 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-bold">Отклонить</button>
                                                <button onclick="approvePendingSale('${s.id}')" class="px-4 py-2 rounded-xl bg-brand-700 hover:bg-brand-800 text-white text-xs font-bold">Одобрить и провести</button>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    ` : ''}

                    <!-- ФОРМА НОВОЙ ОПТОВОЙ ПРОДАЖИ -->
                    <div class="grid grid-cols-1 xl:grid-cols-12 gap-5">
                        <!-- Левая часть: Покупатель + Товары -->
                        <div class="xl:col-span-7 space-y-4">
                            <div class="bg-white rounded-3xl border border-slate-200 p-4 sm:p-5 shadow-xs">
                                <h2 class="text-base font-extrabold text-slate-900 mb-3 flex items-center gap-2">
                                    <span class="w-6 h-6 rounded-full bg-brand-100 text-brand-800 text-xs font-extrabold flex items-center justify-center">1</span>
                                    Покупатель и торговая точка
                                </h2>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-500 mb-1">Покупатель</label>
                                        <select onchange="onDraftBuyerChange(this.value)" class="w-full rounded-2xl border border-slate-300 px-3 py-2.5 text-sm font-semibold bg-white outline-none focus:ring-2 focus:ring-brand-600">
                                            ${state.buyers.map(b => `<option value="${b.id}" ${b.id === saleDraft.buyerId ? 'selected' : ''}>${esc(b.name)}</option>`).join('')}
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-500 mb-1">Магазин</label>
                                        <select onchange="onDraftShopChange(this.value)" class="w-full rounded-2xl border border-slate-300 px-3 py-2.5 text-sm font-semibold bg-white outline-none focus:ring-2 focus:ring-brand-600">
                                            ${(buyer ? buyer.shops : []).map(s => `<option value="${s.id}" ${s.id === saleDraft.shopId ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}
                                        </select>
                                    </div>
                                </div>
                                ${shop ? `
                                    <div class="mt-3 px-3.5 py-2.5 rounded-2xl bg-slate-50 border border-slate-200/80 flex flex-wrap items-center justify-between gap-2 text-xs">
                                        <span class="text-slate-600">${esc(shop.address)}</span>
                                        <span class="font-bold ${shopDebt > 0 ? 'text-rose-600' : 'text-brand-700'}">Текущий долг магазина: ${fmtMoney(shopDebt)}</span>
                                    </div>
                                ` : ''}
                            </div>

                            <div class="bg-white rounded-3xl border border-slate-200 p-4 sm:p-5 shadow-xs">
                                <div class="flex items-center justify-between mb-3">
                                    <h2 class="text-base font-extrabold text-slate-900 flex items-center gap-2">
                                        <span class="w-6 h-6 rounded-full bg-brand-100 text-brand-800 text-xs font-extrabold flex items-center justify-center">2</span>
                                        Подбор товаров и партий
                                    </h2>
                                    <span class="text-[11px] font-semibold text-slate-400">Только кг / шт</span>
                                </div>

                                <div class="grid grid-cols-1 sm:grid-cols-12 gap-2.5 mb-4">
                                    <div class="sm:col-span-6">
                                        <select id="sale-prod-select" onchange="updateBatchSelectOptions()"
                                            class="w-full rounded-2xl border border-slate-300 px-3 py-2.5 text-sm font-medium bg-white outline-none focus:ring-2 focus:ring-brand-600">
                                            ${state.warehouse.map(p => {
                                                const st = getProductStock(p);
                                                return `<option value="${p.id}" ${st <= 0 ? 'disabled' : ''}>${esc(p.name)} — ${fmtMoney(p.price)}/${p.unit} (${fmtQty(st, p.unit)})</option>`;
                                            }).join('')}
                                        </select>
                                    </div>
                                    <div class="sm:col-span-3">
                                        <select id="sale-batch-select" class="w-full rounded-2xl border border-slate-300 px-2.5 py-2.5 text-xs font-semibold bg-white outline-none focus:ring-2 focus:ring-brand-600">
                                            ${renderBatchOptionsHtml(firstProd ? firstProd.id : '')}
                                        </select>
                                    </div>
                                    <div class="sm:col-span-2">
                                        <input id="sale-qty-input" type="number" min="0.1" step="any" value="5" placeholder="Кол-во"
                                            class="w-full rounded-2xl border border-slate-300 px-3 py-2.5 text-sm font-bold text-center outline-none focus:ring-2 focus:ring-brand-600">
                                    </div>
                                    <div class="sm:col-span-1">
                                        <button onclick="addDraftItem()" class="w-full h-full py-2.5 rounded-2xl bg-brand-700 hover:bg-brand-800 text-white font-bold text-base transition-colors">+</button>
                                    </div>
                                </div>

                                ${saleDraft.items.length === 0 ? `
                                    <div class="py-8 text-center rounded-2xl border-2 border-dashed border-slate-200 text-slate-400 text-sm">
                                        Добавьте молочную или мясную продукцию в накладную
                                    </div>
                                ` : `
                                    <div class="overflow-x-auto rounded-2xl border border-slate-200">
                                        <table class="w-full text-xs sm:text-sm text-left">
                                            <thead class="bg-slate-50 text-slate-500 text-[11px] uppercase">
                                                <tr>
                                                    <th class="px-3 py-2.5">Товар / Партия</th>
                                                    <th class="px-3 py-2.5 text-right">Цена</th>
                                                    <th class="px-3 py-2.5 text-center">Кол-во</th>
                                                    <th class="px-3 py-2.5 text-right">Сумма</th>
                                                    <th class="px-2 py-2.5"></th>
                                                </tr>
                                            </thead>
                                            <tbody class="divide-y divide-slate-100">
                                                ${saleDraft.items.map((it, idx) => `
                                                    <tr>
                                                        <td class="px-3 py-2.5">
                                                            <div class="font-semibold text-slate-900">${esc(it.name)}</div>
                                                            <div class="text-[11px] text-slate-400">Партия: ${esc(it.batchNo)}</div>
                                                        </td>
                                                        <td class="px-3 py-2.5 text-right whitespace-nowrap text-slate-600">${fmtMoney(it.price)}/${it.unit}</td>
                                                        <td class="px-3 py-2.5 text-center whitespace-nowrap font-bold text-slate-900">${fmtQty(it.qty, it.unit)}</td>
                                                        <td class="px-3 py-2.5 text-right whitespace-nowrap font-bold text-slate-900">${fmtMoney(it.qty * it.price)}</td>
                                                        <td class="px-2 py-2.5 text-right">
                                                            <button onclick="removeDraftItem(${idx})" class="text-slate-400 hover:text-rose-600 font-bold text-base px-1">&times;</button>
                                                        </td>
                                                    </tr>
                                                `).join('')}
                                            </tbody>
                                        </table>
                                    </div>
                                `}
                            </div>
                        </div>

                        <!-- Правая часть: Ручная скидка и расчёт -->
                        <div class="xl:col-span-5">
                            <div class="bg-white rounded-3xl border border-slate-200 p-4 sm:p-5 shadow-sm space-y-4 sticky top-20">
                                <div class="flex items-center justify-between">
                                    <h2 class="text-base font-extrabold text-slate-900 flex items-center gap-2">
                                        <span class="w-6 h-6 rounded-full bg-brand-100 text-brand-800 text-xs font-extrabold flex items-center justify-center">3</span>
                                        Скидка и оплата
                                    </h2>
                                    <span class="text-[10px] font-mono text-slate-400">${esc(saleDraft.idempotencyKey.slice(-8))}</span>
                                </div>

                                <div class="flex justify-between items-center px-3.5 py-2.5 rounded-2xl bg-slate-50 border border-slate-200">
                                    <span class="text-sm font-medium text-slate-600">Общая сумма:</span>
                                    <span id="live-gross" class="text-lg font-extrabold text-slate-900">${fmtMoney(gross)}</span>
                                </div>

                                <!-- Ручная общая скидка (%) -->
                                <div class="p-4 rounded-2xl border-2 ${exceedsLimit ? 'border-amber-400 bg-amber-50/70' : 'border-brand-600 bg-brand-50/60'}">
                                    <div class="flex items-center justify-between mb-1.5">
                                        <label for="draft-discount-input" class="text-xs font-extrabold uppercase tracking-wide ${exceedsLimit ? 'text-amber-900' : 'text-brand-900'}">
                                            ОБЩАЯ СКИДКА (%)
                                        </label>
                                        <span class="text-xs font-bold ${exceedsLimit ? 'text-amber-700' : 'text-brand-700'}">Ваш лимит: до ${user.maxDiscount}%</span>
                                    </div>
                                    <div class="relative flex items-center">
                                        <input id="draft-discount-input" type="number" min="0" max="100" step="0.1" value="${saleDraft.discountPercent}"
                                            oninput="onLiveDiscountChange(this.value)"
                                            class="w-full rounded-xl border-2 border-slate-200 focus:border-brand-600 bg-white px-4 py-2.5 text-2xl font-extrabold text-slate-900 outline-none pr-10">
                                        <span class="absolute right-3.5 text-xl font-extrabold text-slate-400">%</span>
                                    </div>
                                    <div class="flex flex-wrap gap-1.5 mt-2">
                                        ${[0, 1, 2, 3, 5].map(v => `
                                            <button type="button" onclick="setQuickDiscount(${v})"
                                                class="px-2.5 py-1 rounded-lg text-xs font-bold ${Number(saleDraft.discountPercent) === v ? 'bg-brand-700 text-white' : 'bg-white border border-slate-200 text-slate-700 hover:bg-brand-100'}">
                                                ${v}%
                                            </button>
                                        `).join('')}
                                    </div>
                                    <div id="live-limit-warn" class="${exceedsLimit ? '' : 'hidden'} mt-2.5 p-2 rounded-xl bg-amber-100 text-amber-900 text-xs font-semibold">
                                        Превышен лимит (${user.maxDiscount}%). Накладная уйдёт на подтверждение Владельцу/Администратору.
                                    </div>
                                </div>

                                <div class="space-y-1.5 border-y border-slate-100 py-3">
                                    <div class="flex justify-between text-sm">
                                        <span class="text-slate-600">Сумма скидки:</span>
                                        <span id="live-disc-amt" class="font-bold text-rose-600">− ${fmtMoney(discAmt)}</span>
                                    </div>
                                    <div class="flex justify-between items-center">
                                        <span class="text-sm font-bold text-slate-900">К ОПЛАТЕ:</span>
                                        <span id="live-payable" class="text-2xl font-extrabold text-brand-700">${fmtMoney(payable)}</span>
                                    </div>
                                </div>

                                <div>
                                    <div class="flex justify-between items-center mb-1">
                                        <label class="text-xs font-bold uppercase text-slate-600">Фактическая оплата</label>
                                        <button type="button" onclick="payFullDraft()" class="text-xs font-bold text-brand-700 hover:underline">Оплатить полностью</button>
                                    </div>
                                    <input id="draft-paid-input" type="number" min="0" step="any" value="${saleDraft.paidAmount}"
                                        oninput="onLivePaidChange(this.value)"
                                        class="w-full rounded-2xl border border-slate-300 px-4 py-2.5 text-lg font-extrabold text-slate-900 outline-none focus:ring-2 focus:ring-brand-600">
                                </div>

                                <div class="grid grid-cols-2 gap-2.5">
                                    <div class="p-3 rounded-2xl bg-rose-50 border border-rose-200/70">
                                        <div class="text-[10px] font-bold uppercase text-rose-700">Остаток долга</div>
                                        <div id="live-debt" class="text-sm sm:text-base font-extrabold text-rose-800 mt-0.5">${fmtMoney(debt)}</div>
                                    </div>
                                    <div class="p-3 rounded-2xl bg-emerald-50 border border-emerald-200/70">
                                        <div class="text-[10px] font-bold uppercase text-brand-800">Комиссия (${commRate}%)</div>
                                        <div id="live-comm" class="text-sm sm:text-base font-extrabold text-brand-800 mt-0.5">${fmtMoney(projComm)}</div>
                                    </div>
                                </div>

                                <button id="btn-confirm-sale" onclick="confirmNewSale()"
                                    class="w-full py-3.5 rounded-2xl font-extrabold text-sm sm:text-base text-white shadow-md transition-all ${
                                        exceedsLimit ? 'bg-amber-500 hover:bg-amber-600' : 'bg-brand-700 hover:bg-brand-800'
                                    }">
                                    ${exceedsLimit ? 'Отправить на одобрение скидки' : 'Подтвердить продажу'}
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- ИСТОРИЯ ПРОДАЖ, ПЕЧАТЬ ЧЕКОВ И ВОЗВРАТЫ -->
                    <div class="bg-white rounded-3xl border border-slate-200 shadow-xs overflow-hidden">
                        <div class="p-4 sm:p-5 border-b border-slate-100 flex flex-wrap items-center justify-between gap-2">
                            <div>
                                <h2 class="text-base font-extrabold text-slate-900">Реестр продаж (${visibleSales.length})</h2>
                                <p class="text-xs text-slate-500">Печать Bluetooth-чека (58/80 мм) и оформление частичных/полных возвратов</p>
                            </div>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-xs sm:text-sm text-left">
                                <thead class="bg-slate-50 text-slate-500 text-[11px] uppercase">
                                    <tr>
                                        <th class="px-4 py-3">Чек / Дата</th>
                                        <th class="px-4 py-3">Сотрудник</th>
                                        <th class="px-4 py-3">Покупатель / Магазин</th>
                                        <th class="px-4 py-3 text-right">До скидки</th>
                                        <th class="px-4 py-3 text-center">Скидка</th>
                                        <th class="px-4 py-3 text-right">К оплате</th>
                                        <th class="px-4 py-3 text-right">Оплачено</th>
                                        <th class="px-4 py-3 text-right">Долг</th>
                                        <th class="px-4 py-3 text-right">Комиссия</th>
                                        <th class="px-4 py-3 text-center">Действия</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${visibleSales.map(s => {
                                        const f = calcSaleFinancials(s);
                                        const canRet = s.status === 'confirmed' && s.items.some(i => (i.qty - (i.returnedQty || 0)) > 0);
                                        return `
                                            <tr class="hover:bg-slate-50/80">
                                                <td class="px-4 py-3 whitespace-nowrap">
                                                    <div class="font-bold text-slate-900">${esc(s.id)}</div>
                                                    <div class="text-[11px] text-slate-400">${fmtDateTime(s.createdAt)}</div>
                                                </td>
                                                <td class="px-4 py-3 whitespace-nowrap font-medium text-slate-700">${esc(s.employeeName)}</td>
                                                <td class="px-4 py-3">
                                                    <div class="font-semibold text-slate-900">${esc(s.buyerName)}</div>
                                                    <div class="text-[11px] text-slate-500">${esc(s.shopName)}</div>
                                                </td>
                                                <td class="px-4 py-3 text-right whitespace-nowrap">${fmtMoney(f.activeGross)}</td>
                                                <td class="px-4 py-3 text-center whitespace-nowrap">

                                                </td>
                                                <td class="px-4 py-3 text-right whitespace-nowrap font-bold text-slate-900">${fmtMoney(f.finalPayable)}</td>
                                                <td class="px-4 py-3 text-right whitespace-nowrap font-semibold text-brand-700">${fmtMoney(f.effectivePaid)}</td>
                                                <td class="px-4 py-3 text-right whitespace-nowrap font-semibold ${f.debt > 0 ? 'text-rose-600' : 'text-slate-400'}">${fmtMoney(f.debt)}</td>
                                                <td class="px-4 py-3 text-right whitespace-nowrap font-bold text-indigo-700">${fmtMoney(f.commission)}</td>
                                                <td class="px-4 py-3 text-center whitespace-nowrap">
                                                    <div class="mb-1">${renderSaleStatusBadge(s.status)}</div>
                                                    ${s.status === 'confirmed' ? `
                                                        <div class="flex items-center justify-center gap-1.5">
                                                            <button onclick="openConfirmedOrderModal('${s.id}')" class="px-2.5 py-1 rounded-lg bg-brand-50 hover:bg-brand-100 text-brand-800 text-[11px] font-bold">Чек / BT</button>
                                                            ${canRet ? `<button onclick="openReturnModal('${s.id}')" class="px-2.5 py-1 rounded-lg bg-amber-50 hover:bg-amber-100 text-amber-800 text-[11px] font-bold">Возврат</button>` : ''}
                                                        </div>
                                                    ` : ''}
                                                </td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderSaleStatusBadge(status) {
            if (status === 'confirmed') return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-brand-800">Подтверждён</span>`;
            if (status === 'pending_approval') return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800">Ждёт одобрения</span>`;
            return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-rose-100 text-rose-800">Отклонён</span>`;
        }

        function renderBatchOptionsHtml(productId) {
            const p = state.warehouse.find(x => x.id === productId);
            if (!p) return '';
            const avail = p.batches.filter(b => b.qty > 0);
            if (avail.length === 0) return `<option value="">Нет остатков</option>`;
            return avail.map(b => {
                const d = daysUntil(b.expDate);
                const warn = d < 0 ? ' [ПРОСРОЧЕН]' : d <= 5 ? ` [${d}д]` : '';
                return `<option value="${esc(b.batchNo)}">${esc(b.batchNo)} (${fmtQty(b.qty, p.unit)})${warn}</option>`;
            }).join('');
        }

        function updateBatchSelectOptions() {
            const prodSel = document.getElementById('sale-prod-select');
            const batchSel = document.getElementById('sale-batch-select');
            if (!prodSel || !batchSel) return;
            batchSel.innerHTML = renderBatchOptionsHtml(prodSel.value);
        }

        function onDraftBuyerChange(buyerId) {
            saleDraft.buyerId = buyerId;
            const b = state.buyers.find(x => x.id === buyerId);
            saleDraft.shopId = b && b.shops[0] ? b.shops[0].id : '';
            renderApp();
        }

        function onDraftShopChange(shopId) {
            saleDraft.shopId = shopId;
            renderApp();
        }

        function addDraftItem() {
            const prodId = document.getElementById('sale-prod-select')?.value;
            const batchNo = document.getElementById('sale-batch-select')?.value;
            let qty = parseFloat(document.getElementById('sale-qty-input')?.value);
            const prod = state.warehouse.find(p => p.id === prodId);
            if (!prod || !batchNo) { showToast('Выберите товар и партию', 'error'); return; }
            const batch = prod.batches.find(b => b.batchNo === batchNo);
            if (!batch) return;

            if (daysUntil(batch.expDate) < 0) {
                showToast(`Партия ${batchNo} просрочена! Продажа запрещена.`, 'error');
                return;
            }
            if (isNaN(qty) || qty <= 0) { showToast('Укажите корректное количество', 'error'); return; }
            qty = prod.unit === 'шт' ? Math.max(1, Math.round(qty)) : round2(qty);

            const existing = saleDraft.items.find(i => i.productId === prodId && i.batchNo === batchNo);
            const totalReq = round2((existing ? existing.qty : 0) + qty);
            if (totalReq > batch.qty) {
                showToast(`В партии ${batchNo} доступно только ${fmtQty(batch.qty, prod.unit)}`, 'error');
                return;
            }
            if (existing) existing.qty = totalReq;
            else saleDraft.items.push({ productId: prod.id, batchNo, name: prod.name, unit: prod.unit, price: prod.price, qty });
            renderApp();
        }

        function removeDraftItem(idx) {
            saleDraft.items.splice(idx, 1);
            renderApp();
        }

        function setQuickDiscount(v) {
            saleDraft.discountPercent = v;
            renderApp();
        }

        function payFullDraft() {
            const gross = round2(saleDraft.items.reduce((s, i) => s + i.qty * i.price, 0));
            const discPct = Math.max(0, Math.min(100, Number(saleDraft.discountPercent) || 0));
            saleDraft.paidAmount = round2(gross - round2(gross * discPct / 100));
            renderApp();
        }

        function onLiveDiscountChange(v) {
            saleDraft.discountPercent = v === '' ? 0 : Math.max(0, Math.min(100, parseFloat(v) || 0));
            updateLiveSaleCard();
        }

        function onLivePaidChange(v) {
            saleDraft.paidAmount = v === '' ? 0 : Math.max(0, parseFloat(v) || 0);
            updateLiveSaleCard();
        }

        function updateLiveSaleCard() {
            const user = getActiveUser();
            const gross = round2(saleDraft.items.reduce((s, i) => s + i.qty * i.price, 0));
            const discPct = Math.max(0, Math.min(100, Number(saleDraft.discountPercent) || 0));
            const discAmt = round2(gross * discPct / 100);
            const payable = round2(gross - discAmt);
            const paid = Math.max(0, Number(saleDraft.paidAmount) || 0);
            const debt = round2(Math.max(0, payable - paid));
            const comm = round2(Math.min(paid, payable) * (user.commissionRate || 0) / 100);
            const exceeds = discPct > user.maxDiscount;

            const set = (id, t) => { const el = document.getElementById(id); if (el) el.textContent = t; };
            set('live-gross', fmtMoney(gross));
            set('live-disc-amt', '− ' + fmtMoney(discAmt));
            set('live-payable', fmtMoney(payable));
            set('live-debt', fmtMoney(debt));
            set('live-comm', fmtMoney(comm));

            const warn = document.getElementById('live-limit-warn');
            if (warn) warn.classList.toggle('hidden', !exceeds);
            const btn = document.getElementById('btn-confirm-sale');
            if (btn) {
                btn.textContent = exceeds ? 'Отправить на одобрение скидки' : 'Подтвердить продажу';
                btn.className = `w-full py-3.5 rounded-2xl font-extrabold text-sm sm:text-base text-white shadow-md transition-all ${exceeds ? 'bg-amber-500 hover:bg-amber-600' : 'bg-brand-700 hover:bg-brand-800'}`;
            }
        }

        function confirmNewSale() {
            if (isSubmittingSale) return; // Защита от двойного нажатия
            if (state.usedIdempotencyKeys.includes(saleDraft.idempotencyKey)) {
                showToast('Повторная отправка накладной заблокирована (Idempotency Key)', 'warning');
                return;
            }
            if (saleDraft.items.length === 0) {
                showToast('Добавьте хотя бы один товар', 'error');
                return;
            }
            const user = getActiveUser();
            const { buyer, shop } = findBuyerAndShop(saleDraft.buyerId, saleDraft.shopId);
            if (!buyer || !shop) return;

            // Проверка остатков по партиям
            for (const it of saleDraft.items) {
                const p = state.warehouse.find(x => x.id === it.productId);
                const b = p?.batches.find(x => x.batchNo === it.batchNo);
                if (!b || b.qty < it.qty) {
                    showToast(`Недостаточно товара «${it.name}» в партии ${it.batchNo}`, 'error');
                    return;
                }
            }

            isSubmittingSale = true;
            const discPct = round2(Math.max(0, Math.min(100, Number(saleDraft.discountPercent) || 0)));
            const gross = round2(saleDraft.items.reduce((s, i) => s + i.qty * i.price, 0));
            const payable = round2(gross - round2(gross * discPct / 100));
            const paidInitial = round2(Math.min(Math.max(0, Number(saleDraft.paidAmount) || 0), payable));
            const exceeds = discPct > user.maxDiscount;

            const newId = 'FR-' + state.nextInvoiceNo++;
            const sale = {
                id: newId,
                idempotencyKey: saleDraft.idempotencyKey,
                createdAt: new Date().toISOString(),
                employeeId: user.id,
                employeeName: user.name,
                employeePhone: user.phone,
                commissionRate: user.commissionRate || 0,
                buyerId: buyer.id,
                buyerName: buyer.name,
                shopId: shop.id,
                shopName: shop.name,
                status: exceeds ? 'pending_approval' : 'confirmed',
                items: saleDraft.items.map(i => ({ ...i, returnedQty: 0 })),
                discountPercent: discPct,
                paidInitial,
                debtPaid: 0,
                cashRefunded: 0,
                returns: []
            };

            state.usedIdempotencyKeys.push(sale.idempotencyKey);
            state.sales.unshift(sale);

            if (!exceeds) {
                deductInventoryForSale(sale);
                addLog(`${user.name} (${user.roleLabel})`, 'sale', `Оформлена продажа ${newId} (скидка ${discPct}%)`,
                    `${buyer.name} (${shop.name}). К оплате: ${fmtMoney(payable)}, получено: ${fmtMoney(paidInitial)}.`);
            } else {
                addLog(`${user.name} (${user.roleLabel})`, 'discount_req', `Запрос скидки ${discPct}% по ${newId}`,
                    `Лимит сотрудника: ${user.maxDiscount}%. Отправлено на одобрение.`);
            }

            saleDraft = createEmptyDraft();
            saleDraft.buyerId = buyer.id;
            saleDraft.shopId = shop.id;
            saveState();
            isSubmittingSale = false;
            renderApp();

            if (!exceeds) {
                showToast(`Продажа ${newId} сохранена в облаке!`, 'success');
                openConfirmedOrderModal(newId); // Шаг 3: сразу открывается экран подтверждённого заказа с кнопкой «ПЕЧАТАТЬ ЧЕК»
            } else {
                showToast(`Накладная ${newId} отправлена на подтверждение скидки ${discPct}%`, 'warning');
            }
        }

        function deductInventoryForSale(sale) {
            const { shop } = findBuyerAndShop(sale.buyerId, sale.shopId);
            for (const it of sale.items) {
                const p = state.warehouse.find(x => x.id === it.productId);
                const b = p?.batches.find(x => x.batchNo === it.batchNo);
                if (b) b.qty = round2(Math.max(0, b.qty - it.qty));
                if (shop) {
                    const si = shop.inventory.find(x => x.productId === it.productId);
                    if (si) si.qty = round2(si.qty + it.qty);
                    else shop.inventory.push({ productId: it.productId, name: it.name, unit: it.unit, qty: it.qty });
                }
            }
        }

        function approvePendingSale(saleId) {
            const sale = state.sales.find(s => s.id === saleId);
            if (!sale || sale.status !== 'pending_approval') return;
            for (const it of sale.items) {
                const p = state.warehouse.find(x => x.id === it.productId);
                const b = p?.batches.find(x => x.batchNo === it.batchNo);
                if (!b || b.qty < it.qty) {
                    showToast(`Недостаточно товара «${it.name}» в партии ${it.batchNo}`, 'error');
                    return;
                }
            }
            sale.status = 'confirmed';
            deductInventoryForSale(sale);
            const u = getActiveUser();
            addLog(`${u.name} (${u.roleLabel})`, 'approval', `Одобрена скидка ${sale.discountPercent}% по ${sale.id}`,
                `Накладная проведена, остатки склада и финансы обновлены.`);
            saveState();
            renderApp();
            showToast(`Продажа ${sale.id} одобрена и проведена`, 'success');
        }

        function rejectPendingSale(saleId) {
            const sale = state.sales.find(s => s.id === saleId);
            if (!sale) return;
            sale.status = 'rejected';
            const u = getActiveUser();
            addLog(`${u.name} (${u.roleLabel})`, 'approval', `Отклонён запрос скидки по ${sale.id}`, `Запрашивалась скидка ${sale.discountPercent}%.`);
            saveState();
            renderApp();
            showToast(`Запрос ${sale.id} отклонён`, 'warning');
        }

        /* =========================================================================
           9. ЭКРАН ПОДТВЕРЖДЁННОГО ЗАКАЗА И BLUETOOTH ESC/POS ПЕЧАТЬ ЧЕКА
           ========================================================================= */
        function buildReceiptText(sale) {
            const f = calcSaleFinancials(sale);
            const w = state.printer.paperWidth === 80 ? 44 : 32;
            const sep = '-'.repeat(w);
            const center = (txt) => {
                const pad = Math.max(0, Math.floor((w - txt.length) / 2));
                return ' '.repeat(pad) + txt;
            };
            const row = (l, r) => {
                const space = Math.max(1, w - l.length - r.length);
                return l + ' '.repeat(space) + r;
            };

            const lines = [
                center('ООО ФАЙЗИ РАСУЛ — ОПТ'),
                center('ФАЙЗИ РАСУЛ'),
                center('Молочная и мясная продукция'),
                sep,
                row('Чек №:', sale.id),
                row('Дата:', fmtDateTime(sale.createdAt)),
                `Сотр: ${sale.employeeName}`,
                `Тел:  ${sale.employeePhone}`,
                sep,
                `Покупатель: ${sale.buyerName}`,
                `Магазин:    ${sale.shopName}`,
                sep
            ];

            for (const it of sale.items) {
                const activeQty = round2(it.qty - (it.returnedQty || 0));
                if (activeQty <= 0) continue;
                lines.push(it.name);
                lines.push(row(`  ${fmtQty(activeQty, it.unit)} x ${round2(it.price).toFixed(2)}`, `${round2(activeQty * it.price).toFixed(2)} с.`));
            }

            lines.push(sep);
            lines.push(row('Сумма до скидки:', `${f.activeGross.toFixed(2)} с.`));
            lines.push(row(`ОБЩАЯ СКИДКА (${f.discountPercent}%):`, `-${f.discountAmount.toFixed(2)} с.`));
            lines.push(row('ИТОГО К ОПЛАТЕ:', `${f.finalPayable.toFixed(2)} с.`));
            lines.push(row('Факт. оплата:', `${f.effectivePaid.toFixed(2)} с.`));
            lines.push(row('Задолженность:', `${f.debt.toFixed(2)} с.`));
            lines.push(sep);
            lines.push(center('Спасибо за сотрудничество!'));
            lines.push(center('Файзи Расул • Таджикистан'));
            return lines.join('\n');
        }

        function buildEscPosHexPreview(text) {
            // Имитация реального ESC/POS заголовка: ESC @ (Init), ESC t 17 (CP866), текст, GS V 66 0 (Cut)
            const header = '1B 40 1B 74 11 1B 61 01';
            const sampleBytes = Array.from(text.slice(0, 28)).map(c => c.charCodeAt(0).toString(16).padStart(2, '0').toUpperCase()).join(' ');
            const footer = '0A 0A 0A 1D 56 42 00';
            return `${header} [DATA: ${sampleBytes} ...] ${footer}`;
        }

        function openConfirmedOrderModal(saleId) {
            const sale = state.sales.find(s => s.id === saleId);
            if (!sale) return;
            const f = calcSaleFinancials(sale);
            const pr = state.printer;
            const btReady = pr.connected && !pr.simDisconnected && !pr.simNoPaper;

            openModal(`
                <div class="p-5 sm:p-6 overflow-y-auto space-y-4">
                    <div class="flex items-start justify-between gap-3">
                        <div class="flex items-center gap-3">
                            <div class="w-11 h-11 rounded-2xl bg-emerald-100 text-brand-700 flex items-center justify-center shrink-0">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                                </svg>
                            </div>
                            <div>
                                <h3 class="text-lg font-extrabold text-slate-900">Заказ ${esc(sale.id)} подтверждён</h3>
                                <p class="text-xs text-slate-500">Сохранено в облаке • Остатки и финансы обновлены</p>
                            </div>
                        </div>
                        <button onclick="closeModal()" class="p-1.5 rounded-xl hover:bg-slate-100 text-slate-400 text-xl leading-none">&times;</button>
                    </div>

                    <!-- Статус подключённого Bluetooth-принтера -->
                    <div class="p-3.5 rounded-2xl border flex flex-wrap items-center justify-between gap-2 text-xs ${
                        btReady ? 'bg-brand-50 border-brand-200 text-brand-900' : 'bg-rose-50 border-rose-200 text-rose-800'
                    }">
                        <div>
                            <div class="font-bold">Принтер: ${pr.connected ? esc(pr.deviceName) : 'Не сопряжён'}</div>
                            <div class="opacity-80">Протокол: ${pr.protocol} • Бумага: ${pr.paperWidth} мм • ${btReady ? 'Готов к мгновенной печати' : (pr.simNoPaper ? 'Ошибка: Нет бумаги!' : 'Ошибка: Принтер отключён!')}</div>
                        </div>
                        <button onclick="closeModal(); navigate('printer')" class="underline font-bold">Настройки BT</button>
                    </div>

                    <!-- Главная кнопка ПЕЧАТАТЬ ЧЕК -->
                    <div class="flex flex-wrap gap-2">
                        <button onclick="triggerThermalPrint('${sale.id}', false)"
                            class="flex-1 py-3.5 px-4 rounded-2xl bg-brand-700 hover:bg-brand-800 text-white font-extrabold text-sm sm:text-base shadow-md flex items-center justify-center gap-2 transition-all">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/>
                            </svg>
                            <span>ПЕЧАТАТЬ ЧЕК</span>
                        </button>
                        <button onclick="triggerThermalPrint('${sale.id}', true)"
                            class="px-4 py-3.5 rounded-2xl border border-slate-300 hover:bg-slate-50 text-slate-700 font-bold text-xs sm:text-sm">
                            Повторная печать
                        </button>
                    </div>

                    <!-- Зона визуализации напечатанного термочека -->
                    <div id="thermal-output-wrap" class="hidden space-y-3 pt-2">
                        <div class="flex items-center justify-between text-xs text-slate-500">
                            <span id="thermal-status-label" class="font-bold text-brand-700">Печать завершена (${pr.paperWidth} мм)</span>
                            <div class="flex gap-2">
                                <button onclick="printReceiptSystem('${sale.id}')" class="text-brand-700 font-bold hover:underline">Системная печать</button>
                                <button onclick="document.getElementById('escpos-raw-box').classList.toggle('hidden')" class="text-slate-600 font-semibold hover:underline">ESC/POS буфер</button>
                            </div>
                        </div>
                        <div class="bg-slate-200/70 p-4 rounded-2xl flex justify-center">
                            <pre id="thermal-paper-content" class="receipt-paper p-4 font-mono text-[11px] leading-snug text-slate-900 whitespace-pre overflow-x-auto ${pr.paperWidth === 80 ? 'w-[340px]' : 'w-[260px]'}"></pre>
                        </div>
                        <div id="escpos-raw-box" class="hidden p-3 rounded-xl bg-slate-900 text-emerald-400 font-mono text-[10px] break-all"></div>
                    </div>

                    <!-- Краткая сводка заказа -->
                    <div class="grid grid-cols-3 gap-2 pt-2 border-t border-slate-100 text-center">
                        <div class="p-2.5 rounded-xl bg-slate-50">
                            <div class="text-[10px] text-slate-500 uppercase">К оплате</div>
                            <div class="text-sm font-extrabold text-slate-900">${fmtMoney(f.finalPayable)}</div>
                        </div>
                        <div class="p-2.5 rounded-xl bg-emerald-50">
                            <div class="text-[10px] text-brand-700 uppercase">Оплачено</div>
                            <div class="text-sm font-extrabold text-brand-800">${fmtMoney(f.effectivePaid)}</div>
                        </div>
                        <div class="p-2.5 rounded-xl bg-rose-50">
                            <div class="text-[10px] text-rose-700 uppercase">Долг</div>
                            <div class="text-sm font-extrabold text-rose-700">${fmtMoney(f.debt)}</div>
                        </div>
                    </div>
                </div>
            `);
        }

        function triggerThermalPrint(saleId, isReprint) {
            const pr = state.printer;
            if (!pr.connected || pr.simDisconnected) {
                showToast('Ошибка Bluetooth: принтер отключён! Проверьте питание и сопряжение.', 'error');
                return;
            }
            if (pr.simNoPaper) {
                showToast('Ошибка принтера: в термопринтере закончилась бумага!', 'error');
                return;
            }
            const sale = state.sales.find(s => s.id === saleId);
            if (!sale) return;

            const receiptText = buildReceiptText(sale);
            const wrap = document.getElementById('thermal-output-wrap');
            const paper = document.getElementById('thermal-paper-content');
            const rawBox = document.getElementById('escpos-raw-box');
            const label = document.getElementById('thermal-status-label');

            if (wrap && paper) {
                wrap.classList.remove('hidden');
                paper.classList.remove('thermal-printing');
                void paper.offsetWidth; // перезапуск анимации
                paper.textContent = receiptText;
                paper.classList.add('thermal-printing');
                if (rawBox) rawBox.textContent = 'ESC/POS HEX: ' + buildEscPosHexPreview(receiptText);
                if (label) label.textContent = `${isReprint ? 'Повторная печать' : 'Напечатано'} на ${pr.deviceName} (${pr.paperWidth} мм)`;
            }

            pr.lastPrintAt = new Date().toISOString();
            saveState();
            showToast(`${isReprint ? 'Повторный чек' : 'Чек'} ${sale.id} отправлен на ${pr.deviceName}`, 'success');
        }

        function printReceiptSystem(saleId) {
            const sale = state.sales.find(s => s.id === saleId);
            if (!sale) return;
            const printArea = document.getElementById('print-area');
            printArea.innerHTML = `<pre style="font-family: monospace; font-size: 12px; white-space: pre-wrap;">${esc(buildReceiptText(sale))}</pre>`;
            window.print();
        }

        /* =========================================================================
           10. ВОЗВРАТЫ (ЧАСТИЧНЫЙ И ПОЛНЫЙ С ПЕРЕСЧЁТОМ СКИДКИ, ДОЛГА И КОМИССИИ)
           ========================================================================= */
        function openReturnModal(saleId) {
            const sale = state.sales.find(s => s.id === saleId);
            if (!sale || sale.status !== 'confirmed') return;
            openModal(`
                <div class="p-5 sm:p-6 overflow-y-auto space-y-4">

                                    <input id="ret-in-${idx}" type="number" min="0" max="${avail}" step="${it.unit === 'шт' ? '1' : '0.1'}" value="0" ${avail <= 0 ? 'disabled' : ''}

                        <button onclick="confirmReturn('${sale.id}')" class="px-5 py-2 rounded-xl bg-amber-600 hover:bg-amber-700 text-white text-sm font-bold">Провести возврат</button>

        function confirmReturn(saleId) {
            const sale = state.sales.find(s => s.id === saleId);
            if (!sale) return;
            const entries = [];
            let grossRet = 0;

            for (let i = 0; i < sale.items.length; i++) {
                const it = sale.items[i];
                const avail = round2(it.qty - (it.returnedQty || 0));
                let val = parseFloat(document.getElementById(`ret-in-${i}`)?.value) || 0;
                if (val <= 0) continue;
                val = it.unit === 'шт' ? Math.round(val) : round2(val);
                if (val > avail) { showToast(`Превышен остаток для «${it.name}»`, 'error'); return; }
                entries.push({ it, val });
                grossRet = round2(grossRet + val * it.price);
            }
            if (entries.length === 0) { showToast('Укажите количество для возврата', 'warning'); return; }

            const { shop } = findBuyerAndShop(sale.buyerId, sale.shopId);
            for (const e of entries) {
                e.it.returnedQty = round2((e.it.returnedQty || 0) + e.val);
                // Возврат на центральный склад в исходную партию
                const p = state.warehouse.find(x => x.id === e.it.productId);
                const b = p?.batches.find(x => x.batchNo === e.it.batchNo);
                if (b) b.qty = round2(b.qty + e.val);
                // Уменьшение в магазине
                if (shop) {
                    const si = shop.inventory.find(x => x.productId === e.it.productId);
                    if (si) si.qty = round2(Math.max(0, si.qty - e.val));
                }
            }

            const netReturn = round2(grossRet * (1 - sale.discountPercent / 100));
            const tempF = calcSaleFinancials(sale);
            let cashRefund = 0;
            if (tempF.effectivePaid > tempF.finalPayable) {
                cashRefund = round2(tempF.effectivePaid - tempF.finalPayable);
                sale.cashRefunded = round2((sale.cashRefunded || 0) + cashRefund);
            }
            const newF = calcSaleFinancials(sale);
            sale.returns.push({ id: 'RET-' + Date.now(), date: new Date().toISOString(), grossRet, netReturn, cashRefund });

            const u = getActiveUser();
            addLog(`${u.name} (${u.roleLabel})`, 'return', `Возврат по ${sale.id} на ${fmtMoney(netReturn)}`,
                `Учтена скидка ${sale.discountPercent}%. Новый долг: ${fmtMoney(newF.debt)}, комиссия: ${fmtMoney(newF.commission)}.${cashRefund > 0 ? ` Возврат наличных: ${fmtMoney(cashRefund)}.` : ''}`);

            saveState();
            closeModal();
            renderApp();
            showToast(`Возврат на ${fmtMoney(netReturn)} проведён. Комиссия пересчитана.`, 'success');
        }

        function confirmDebtPay(buyerId, shopId) {
            const { buyer, shop } = findBuyerAndShop(buyerId, shopId);

            if (amt <= 0) { showToast('Введите сумму больше 0', 'error'); return; }
            if (amt > maxDebt) amt = maxDebt;

            let rem = amt;
            const unpaid = state.sales.filter(s => s.status === 'confirmed' && s.shopId === shopId).reverse();
            for (const s of unpaid) {
                if (rem <= 0) break;
                const f = calcSaleFinancials(s);
                if (f.debt > 0) {
                    const part = round2(Math.min(rem, f.debt));
                    s.debtPaid = round2((s.debtPaid || 0) + part);
                    rem = round2(rem - part);
                }
            }
            const u = getActiveUser();
            addLog(`${u.name} (${u.roleLabel})`, 'payment', `Погашение долга ${shop.name}: ${fmtMoney(amt)}`,

            saveState();
            closeModal();
            renderApp();
            showToast(`Оплата долга ${fmtMoney(amt)} принята`, 'success');

        function pairPrinter(devId) {

            state.printer.connected = true;
            state.printer.deviceId = d.id;
            state.printer.deviceName = d.name;
            state.printer.mac = d.mac;
            state.printer.protocol = d.protocol;
            state.printer.simDisconnected = false;
            saveState();
            renderApp();
            showToast(`Принтер ${d.name} сопряжён и сохранён`, 'success');

        function disconnectPrinter() {
            state.printer.connected = false;
            saveState();
            renderApp();
            showToast('Bluetooth-принтер отключён', 'warning');

        function checkPrinterConnection() {
            const pr = state.printer;
            if (!pr.connected || pr.simDisconnected) {
                showToast('Связь отсутствует! Проверьте Bluetooth и питание принтера.', 'error');
            } else if (pr.simNoPaper) {
                showToast('Связь установлена, но датчик сообщает: НЕТ БУМАГИ.', 'warning');
            } else {
                showToast(`Соединение стабильно: ${pr.deviceName} (${pr.protocol}, ${pr.paperWidth}мм)`, 'success');
            }
        }

            const pr = state.printer;
            if (!pr.connected || pr.simDisconnected) { showToast('Ошибка: принтер отключён', 'error'); return; }
            if (pr.simNoPaper) { showToast('Ошибка: нет бумаги в термопринтере', 'error'); return; }

            const box = document.getElementById('test-print-preview');
            if (box) {
                box.classList.remove('hidden');
                const w = pr.paperWidth === 80 ? 'w-[320px]' : 'w-[240px]';

        function renderInventoryTab() {
            let totalDiffMoney = 0;
            return `

                        </div>
                        <button onclick="applyInventoryCount()" class="px-5 py-2.5 rounded-2xl bg-brand-700 hover:bg-brand-800 text-white text-xs sm:text-sm font-bold shadow-sm">
                            Провести инвентаризацию
                        </button>
                    </div>

                    <div class="bg-white rounded-3xl border border-slate-200 shadow-xs overflow-hidden">

                            <table class="w-full text-xs sm:text-sm text-left">

                                        <th class="px-4 py-3">Товар</th>
                                        <th class="px-4 py-3 text-right">Цена</th>
                                        <th class="px-4 py-3 text-right">Учётный остаток</th>
                                        <th class="px-4 py-3 text-center">Фактический остаток</th>
                                        <th class="px-4 py-3 text-right">Расхождение</th>
                                        <th class="px-4 py-3 text-right">Сумма расх.</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    ${state.warehouse.map(p => {
                                        const acc = getProductStock(p);
                                        const actual = inventoryInputs[p.id] !== undefined ? inventoryInputs[p.id] : acc;
                                        const diff = round2(actual - acc);
                                        const diffMoney = round2(diff * p.price);
                                        totalDiffMoney = round2(totalDiffMoney + diffMoney);
                                        return `
                                            <tr>
                                                <td class="px-4 py-3 font-semibold text-slate-900">${esc(p.name)}</td>
                                                <td class="px-4 py-3 text-right whitespace-nowrap text-slate-500">${fmtMoney(p.price)}</td>
                                                <td class="px-4 py-3 text-right whitespace-nowrap font-bold">${fmtQty(acc, p.unit)}</td>
                                                <td class="px-4 py-3 text-center">
                                                    <input type="number" min="0" step="${p.unit === 'шт' ? '1' : '0.1'}" value="${actual}"
                                                        onchange="setInventoryInput('${p.id}', this.value)"
                                                        class="w-24 text-center rounded-xl border border-slate-300 px-2 py-1.5 font-bold outline-none focus:ring-2 focus:ring-brand-600">
                                                </td>
                                                <td class="px-4 py-3 text-right whitespace-nowrap font-bold ${diff < 0 ? 'text-rose-600' : diff > 0 ? 'text-brand-700' : 'text-slate-400'}">
                                                    ${diff > 0 ? '+' : ''}${fmtQty(diff, p.unit)}
                                                </td>
                                                <td class="px-4 py-3 text-right whitespace-nowrap font-bold ${diffMoney < 0 ? 'text-rose-600' : diffMoney > 0 ? 'text-brand-700' : 'text-slate-400'}">
                                                    ${diffMoney > 0 ? '+' : ''}${fmtMoney(diffMoney)}
                                                </td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                                <tfoot class="bg-slate-50 font-extrabold">
                                    <tr>
                                        <td colspan="5" class="px-4 py-3 text-right text-slate-700">Итоговое расхождение по складу:</td>
                                        <td class="px-4 py-3 text-right ${totalDiffMoney < 0 ? 'text-rose-600' : 'text-brand-700'}">${totalDiffMoney > 0 ? '+' : ''}${fmtMoney(totalDiffMoney)}</td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function setInventoryInput(prodId, val) {
            const p = state.warehouse.find(x => x.id === prodId);
            let n = Math.max(0, parseFloat(val) || 0);
            if (p && p.unit === 'шт') n = Math.round(n);
            else n = round2(n);
            inventoryInputs[prodId] = n;
            renderApp();
        }

        function applyInventoryCount() {
            const changes = [];
            for (const p of state.warehouse) {
                const acc = getProductStock(p);
                const actual = inventoryInputs[p.id] !== undefined ? inventoryInputs[p.id] : acc;
                const diff = round2(actual - acc);
                if (diff === 0) continue;

                changes.push(`${p.name}: ${diff > 0 ? '+' : ''}${fmtQty(diff, p.unit)}`);
                if (diff > 0) {
                    if (p.batches.length > 0) p.batches[p.batches.length - 1].qty = round2(p.batches[p.batches.length - 1].qty + diff);
                    else p.batches.push({ batchNo: 'INV-' + Date.now().toString().slice(-4), mfgDate: addDaysISO(0), expDate: addDaysISO(14), qty: diff });
                } else {
                    let rem = Math.abs(diff);
                    for (const b of p.batches) {
                        if (rem <= 0) break;
                        const take = round2(Math.min(b.qty, rem));
                        b.qty = round2(b.qty - take);
                        rem = round2(rem - take);
                    }
                }
            }

            if (changes.length === 0) {
                showToast('Расхождений не выявлено — инвентаризация сошлась 100%', 'info');
                return;
            }

            const u = getActiveUser();
            addLog(`${u.name} (${u.roleLabel})`, 'inventory', `Проведена инвентаризация склада`, `Корректировки: ${changes.join('; ')}`);
            inventoryInputs = {};
            saveState();
            renderApp();
            showToast('Инвентаризация проведена, остатки скорректированы', 'success');
        }

        function exportReportExcel() {
            const headers = ['Сотрудник', 'Ставка %', 'Продаж', 'До скидки (TJS)', 'Скидки (TJS)', 'К оплате (TJS)', 'Факт. получено (TJS)', 'Долг (TJS)', 'Возвраты (TJS)', 'Комиссия (TJS)'];
            const rows = [headers.join(';')];
            const emps = state.users.filter(u => u.role === 'employee' || state.sales.some(s => s.employeeId === u.id));
            for (const emp of emps) {
                const st = computeEmployeeStats(emp.id);
                rows.push([
                    emp.name, emp.commissionRate, st.count,
                    st.gross.toFixed(2), st.discount.toFixed(2), st.payable.toFixed(2),
                    st.paid.toFixed(2), st.debt.toFixed(2), st.returns.toFixed(2), st.comm.toFixed(2)
                ].join(';'));
            }
            // UTF-8 BOM для идеального открытия кириллицы в Microsoft Excel
            const blob = new Blob(['\uFEFF' + rows.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Fayzi_Rasul_Report_${addDaysISO(0)}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('Файл Excel (.csv, UTF-8) успешно скачан', 'success');
        }

        function confirmRenewSubscription() {

            const amount = months * 65;
            const baseDate = new Date(Math.max(Date.now(), new Date(state.subscription.expiresAt).getTime()));

            state.subscription.expiresAt = baseDate.toISOString().split('T')[0];

                months, amount, method, txCode, status: 'Подтверждён'

        const FLUTTER_CODE_SNIPPET = `// pubspec.yaml (Android-only: flutter create --platforms=android fayzi_rasul)
// android/app/build.gradle -> minSdkVersion 26 (Android 8.0+)
// dependencies:
//   supabase_flutter: ^2.5.6
//   blue_thermal_printer: ^1.2.3
//   esc_pos_utils_plus: ^2.0.4
//   shared_preferences: ^2.2.3

import 'package:blue_thermal_printer/blue_thermal_printer.dart';
import 'package:shared_preferences/shared_preferences.dart';

class FayziBluetoothPrinterService {
  final BlueThermalPrinter _bt = BlueThermalPrinter.instance;
  static const _savedMacKey = 'fayzi_bt_printer_mac';

  /// Однократное сопряжение и сохранение MAC-адреса принтера
  Future<bool> connectAndSave(BluetoothDevice device) async {
    await _bt.connect(device);
    final prefs = await SharedPreferences.getInstance();
    await prefs.setString(_savedMacKey, device.address ?? '');
    return (await _bt.isConnected) ?? false;
  }

  /// Автоподключение к сохранённому принтеру без повторного выбора
  Future<bool> ensureConnected() async {
    if ((await _bt.isConnected) == true) return true;
    final prefs = await SharedPreferences.getInstance();
    final mac = prefs.getString(_savedMacKey);
    if (mac == null || mac.isEmpty) return false;
    final bonded = await _bt.getBondedDevices();
    final target = bonded.where((d) => d.address == mac).firstOrNull;
    if (target == null) return false;
    await _bt.connect(target);
    return (await _bt.isConnected) ?? false;
  }

  /// Мгновенная печать чека ESC/POS (58мм / 80мм)
  Future<void> printSaleReceipt(Map<String, dynamic> sale, {int paperMm = 58}) async {
    if (!await ensureConnected()) {
      throw Exception('Принтер не подключён. Проверьте питание Bluetooth.');
    }
    _bt.printCustom('ООО ФАЙЗИ РАСУЛ — ОПТ', 2, 1);
    _bt.printCustom('ФАЙЗИ РАСУЛ', 1, 1);
    _bt.printLeftRight('Чек №:', sale['invoice_no'], 1);
    _bt.printLeftRight('Сотрудник:', sale['employee_name'], 1);
    _bt.printLeftRight('Покупатель:', sale['buyer_name'], 1);
    _bt.printLeftRight('Магазин:', sale['shop_name'], 1);
    _bt.printCustom('--------------------------------', 1, 1);
    for (final item in sale['items']) {
      _bt.printCustom(item['name'], 1, 0);
      _bt.printLeftRight('\${item['qty']} \${item['unit']} x \${item['price']}', '\${item['total']} с.', 1);
    }
    _bt.printCustom('--------------------------------', 1, 1);
    _bt.printLeftRight('ОБЩАЯ СКИДКА:', '\${sale['discount_percent']}%', 1);
    _bt.printLeftRight('ИТОГО К ОПЛАТЕ:', '\${sale['final_payable']} с.', 2);
    _bt.printLeftRight('Оплачено:', '\${sale['paid_amount']} с.', 1);
    _bt.printLeftRight('Долг:', '\${sale['debt']} с.', 1);
    _bt.printNewLine();
    _bt.paperCut();
  }
}`;

        const SUPABASE_SQL_SNIPPET = `-- 1. РОЛИ И ПРОФИЛИ (Владелец, Администратор с подтверждением, Сотрудник)
CREATE TYPE user_role AS ENUM ('owner', 'admin', 'employee');

CREATE TABLE business_accounts (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  name TEXT NOT NULL DEFAULT 'Файзи Расул',
  subscription_price_tjs NUMERIC(10,2) NOT NULL DEFAULT 65.00,
  subscription_expires_at TIMESTAMPTZ NOT NULL,
  created_at TIMESTAMPTZ DEFAULT now()
);

CREATE TABLE profiles (
  id UUID PRIMARY KEY REFERENCES auth.users(id) ON DELETE CASCADE,
  business_id UUID NOT NULL REFERENCES business_accounts(id),
  full_name TEXT NOT NULL,
  phone TEXT NOT NULL,
  role user_role NOT NULL DEFAULT 'employee',
  admin_approved BOOLEAN NOT NULL DEFAULT FALSE,
  max_discount_pct NUMERIC(5,2) NOT NULL DEFAULT 3.00,
  commission_rate_pct NUMERIC(5,2) NOT NULL DEFAULT 4.00,
  can_receive_stock BOOLEAN NOT NULL DEFAULT FALSE
);

-- 2. ПРОДАЖИ С ЗАЩИТОЙ ОТ ДУБЛЕЙ (idempotency_key)
CREATE TABLE sales (
  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
  business_id UUID NOT NULL REFERENCES business_accounts(id),
  invoice_no TEXT NOT NULL UNIQUE,
  idempotency_key TEXT NOT NULL UNIQUE,
  employee_id UUID NOT NULL REFERENCES profiles(id),
  shop_id UUID NOT NULL,
  gross_total NUMERIC(12,2) NOT NULL,
  discount_percent NUMERIC(5,2) NOT NULL DEFAULT 0 CHECK (discount_percent >= 0 AND discount_percent <= 100),
  discount_amount NUMERIC(12,2) NOT NULL,
  final_payable NUMERIC(12,2) NOT NULL,
  paid_amount NUMERIC(12,2) NOT NULL DEFAULT 0,
  debt_amount NUMERIC(12,2) NOT NULL,
  commission_amount NUMERIC(12,2) NOT NULL DEFAULT 0,
  status TEXT NOT NULL CHECK (status IN ('confirmed','pending_approval','rejected')),
  created_at TIMESTAMPTZ DEFAULT now()
);

-- 3. СЕРВЕРНАЯ ПРОВЕРКА ПОДПИСКИ И НАЧИСЛЕНИЯ КОМИССИИ
CREATE OR REPLACE FUNCTION check_subscription_and_calc_commission()
RETURNS TRIGGER AS $$
DECLARE
  sub_exp TIMESTAMPTZ;
  emp_rate NUMERIC(5,2);
BEGIN
  SELECT subscription_expires_at INTO sub_exp FROM business_accounts WHERE id = NEW.business_id;
  IF sub_exp < now() THEN
    RAISE EXCEPTION 'Подписка бизнес-аккаунта (65 сомони/мес) истекла';
  END IF;
  SELECT commission_rate_pct INTO emp_rate FROM profiles WHERE id = NEW.employee_id;
  -- Комиссия строго от фактически полученных денег!
  NEW.commission_amount := ROUND(LEAST(NEW.paid_amount, NEW.final_payable) * emp_rate / 100.0, 2);
  RETURN NEW;
END;
$$ LANGUAGE plpgsql SECURITY DEFINER;

CREATE TRIGGER trg_sales_guard BEFORE INSERT OR UPDATE ON sales
FOR EACH ROW EXECUTE FUNCTION check_subscription_and_calc_commission();

-- 4. RLS ПОЛИТИКА: ТОЛЬКО ВЛАДЕЛЕЦ ПОДТВЕРЖДАЕТ АДМИНИСТРАТОРОВ
ALTER TABLE profiles ENABLE ROW LEVEL SECURITY;
CREATE POLICY "Owner manages admins" ON profiles FOR UPDATE
USING (EXISTS (SELECT 1 FROM profiles p WHERE p.id = auth.uid() AND p.role = 'owner' AND p.business_id = profiles.business_id));`;

                            <li><strong>Установка на Android-телефоны сотрудников и владельца:</strong> передать APK через Telegram/WhatsApp или USB → открыть файл на телефоне → разрешить «Установка из неизвестных источников» → нажать «Установить» → выполнить однократное сопряжение с Bluetooth-принтером.</li>
                        </ol>
                    </div>
                `;
            }

            return `

                    </div>
                    <div class="flex flex-wrap gap-2">
                        ${subBtn('flutter', '1. Flutter + Bluetooth ESC/POS')}

                        ${subBtn('guide', '3. Сборка и установка APK')}
                    </div>
                    ${body}
                </div>
            `;
        }

        /* =========================================================================
